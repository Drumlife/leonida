<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icônes Leonida</title>
  <style>
    :root { --bg: #0f1115; --panel: #181b22; --border: #2a2f3a; --text: #e8eaf0; --muted: #9aa3b2; --ok: #22c55e; --ko: #ef4444; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; background: rgba(15,17,21,.95); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    h1 { font-size: 18px; margin: 0 12px 0 0; }
    .summary { color: var(--muted); }
    .summary b { color: var(--text); }
    button { font: inherit; color: inherit; background: #232834; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    button:hover { border-color: var(--muted); }
    main { padding: 8px 16px 40px; max-width: 1200px; margin: 0 auto; }
    h2 { font-size: 15px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
    h2 .dot { width: 12px; height: 12px; border-radius: 50%; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .card.ok { border-color: var(--ok); }
    .card.ko { border-color: var(--ko); }
    .previews { display: flex; align-items: center; gap: 10px; }
    .onmap { background: #6f9a6a url() center/cover; border-radius: 6px; padding: 6px 8px; display: flex; gap: 6px; align-items: center; background-image: linear-gradient(135deg, #7aa56f 0 40%, #d8d2bd 40% 46%, #3f92b3 46%); }
    .num { color: var(--muted); font-size: 12px; }
    .name { font-weight: 600; }
    .fr { color: var(--muted); font-size: 12.5px; }
    .actions { display: flex; gap: 6px; }
    .actions button { flex: 1; padding: 4px; }
    .card.ok .yes { background: var(--ok); border-color: var(--ok); color: #fff; }
    .card.ko .no { background: var(--ko); border-color: var(--ko); color: #fff; }
    .alts { display: flex; flex-direction: column; gap: 4px; }
    .alt-row { display: flex; gap: 6px; }
    .alt { padding: 3px; line-height: 0; border-radius: 8px; }
    .alt.chosen { border-color: #3b82f6; outline: 2px solid #3b82f6; background: #1e3a8a; }
    body.only-redo .card:not(.has-alts) { display: none; }
    body.only-redo h2 { display: none; }
    body.only-redo .grid { margin-top: 12px; }
    @media (max-width: 500px) { header, main { padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <header>
    <h1>Icônes Leonida</h1>
    <span class="summary" id="summary"></span>
    <button id="only-redo">Seulement les propositions</button>
    <button id="copy">Copier le résumé</button>
    <button id="reset">Effacer mes choix</button>
  </header>
  <main id="main"></main>

  <script src="data/material-icons.js"></script>
  <script src="icons.js"></script>
  <script>
    (function () {
      "use strict";
      const KEY = "leonida.iconReview";
      const { GROUPS, ICONS, svg } = window.LeonidaIcons;
      let review = {};
      try { review = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { review = {}; }
      const store = () => { try { localStorage.setItem(KEY, JSON.stringify(review)); } catch (e) {} };

      const CKEY = "leonida.iconChoice";
      let choice = {};
      try { choice = JSON.parse(localStorage.getItem(CKEY)) || {}; } catch (e) { choice = {}; }
      const storeChoice = () => { try { localStorage.setItem(CKEY, JSON.stringify(choice)); } catch (e) {} };

      // Choix devenus caducs (propositions remplacées depuis) : on les oublie.
      for (const id of Object.keys(choice)) {
        const ic = LeonidaIcons.byId[id];
        if (!ic || !ic.alts[choice[id]]) delete choice[id];
      }
      storeChoice();
      const artOf = (ic) => (choice[ic.id] != null ? ic.alts[choice[ic.id]] : ic.art);
      const altLabel = (a) => a.ms + (a.badge ? " + " + a.badge : "");

      function previews(ic) {
        const art = artOf(ic);
        return `${svg(ic.id, { size: 56, art })}${svg(ic.id, { size: 56, found: true, art })}` +
          `<div class="onmap" title="Taille réelle sur la carte">${svg(ic.id, { size: 26, art })}${svg(ic.id, { size: 26, found: true, art })}</div>`;
      }

      const main = document.getElementById("main");
      for (const g of GROUPS) {
        const items = ICONS.filter((ic) => ic.group === g.id);
        if (!items.length) continue;
        const h = document.createElement("h2");
        h.innerHTML = `<span class="dot" style="background:${g.color}"></span>${g.name} <span class="num">(${items.length})</span>`;
        main.append(h);
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const ic of items) {
          const card = document.createElement("div");
          card.className = "card" + (ic.alts.length ? " has-alts" : "");
          card.dataset.id = ic.id;
          card.innerHTML =
            `<div class="previews"></div>` +
            `<div><span class="num">#${ic.n}</span> <span class="name">${ic.name}</span><div class="fr">${ic.fr}</div></div>` +
            (ic.alts.length
              ? `<div class="alts"><div class="fr">Propositions (clique pour choisir) :</div><div class="alt-row">` +
                ic.alts.map((a, k) => `<button class="alt" data-k="${k}" title="${altLabel(a)}">${svg(ic.id, { size: 40, art: a })}</button>`).join("") +
                `</div></div>`
              : "") +
            `<div class="actions"><button class="yes">✓ OK</button><button class="no">✗ À refaire</button></div>`;
          card.querySelector(".yes").onclick = () => set(ic.id, "ok");
          card.querySelector(".no").onclick = () => set(ic.id, "ko");
          for (const btn of card.querySelectorAll(".alt")) {
            btn.onclick = () => {
              const k = Number(btn.dataset.k);
              if (choice[ic.id] === k) delete choice[ic.id];
              else { choice[ic.id] = k; review[ic.id] = "ok"; store(); }
              storeChoice();
              paint();
            };
          }
          grid.append(card);
        }
        main.append(grid);
      }

      function set(id, v) {
        review[id] = review[id] === v ? undefined : v;
        if (!review[id]) delete review[id];
        store();
        paint();
      }

      function paint() {
        for (const card of document.querySelectorAll(".card")) {
          const ic = LeonidaIcons.byId[card.dataset.id];
          const v = review[ic.id];
          card.classList.toggle("ok", v === "ok");
          card.classList.toggle("ko", v === "ko");
          card.querySelector(".previews").innerHTML = previews(ic);
          for (const btn of card.querySelectorAll(".alt")) btn.classList.toggle("chosen", choice[ic.id] === Number(btn.dataset.k));
        }
        const ok = ICONS.filter((i) => review[i.id] === "ok").length;
        const ko = ICONS.filter((i) => review[i.id] === "ko").length;
        const alts = ICONS.filter((i) => i.alts.length);
        const chosen = alts.filter((i) => choice[i.id] != null).length;
        document.getElementById("summary").innerHTML =
          `<b>${ICONS.length}</b> icônes · <b style="color:var(--ok)">${ok}</b> approuvées · <b style="color:var(--ko)">${ko}</b> à refaire · ` +
          `${ICONS.length - ok - ko} à voir · remplacements choisis : <b>${chosen}/${alts.length}</b>`;
      }

      const onlyBtn = document.getElementById("only-redo");
      onlyBtn.onclick = () => {
        const on = document.body.classList.toggle("only-redo");
        onlyBtn.textContent = on ? "Tout afficher" : "Seulement les propositions";
      };

      document.getElementById("copy").onclick = () => {
        const ko = ICONS.filter((i) => review[i.id] === "ko").map((i) => `#${i.n} ${i.name}`);
        const ok = ICONS.filter((i) => review[i.id] === "ok").map((i) => `#${i.n}`);
        const ch = ICONS.filter((i) => choice[i.id] != null).map((i) => `#${i.n} → ${altLabel(i.alts[choice[i.id]])}`);
        const text = `Approuvées (${ok.length}) : ${ok.join(", ") || "aucune"}
À refaire (${ko.length}) : ${ko.join(", ") || "aucune"}` +
          `
Remplacements choisis (${ch.length}) : ${ch.join(", ") || "aucun"}`;
        navigator.clipboard?.writeText(text).then(() => alert("Résumé copié : colle-le dans la conversation."), () => prompt("Copie ce texte :", text));
      };
      document.getElementById("reset").onclick = () => {
        if (!confirm("Effacer tous tes choix ?")) return;
        review = {};
        choice = {};
        store();
        storeChoice();
        paint();
      };
      paint();
    })();
  </script>
</body>
</html>
